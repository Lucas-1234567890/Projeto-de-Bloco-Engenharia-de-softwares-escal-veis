spring.application.name=history-service
server.port=8082

# Banco de produção próprio (database-per-service) - configurável via variáveis de ambiente
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/historydb}
spring.datasource.username=${DB_USER:history}
spring.datasource.password=${DB_PASSWORD:history}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate NUNCA cria/altera schema em produção. Quem manda é o Flyway.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Registro no Eureka
eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

# --- TP4: RabbitMQ (arquitetura orientada a eventos) ---
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:todo}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:todo}

# Retry com backoff exponencial: 1s -> 2s -> (falha) ...
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=10s
# Depois do último retry a mensagem NÃO volta para a fila: vai para a Dead Letter Queue
spring.rabbitmq.listener.simple.default-requeue-rejected=false
# Quantas mensagens cada consumidor recebe adiantado (afeta a distribuição entre instâncias)
spring.rabbitmq.listener.simple.prefetch=10
