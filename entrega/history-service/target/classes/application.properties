spring.application.name=history-service
server.port=8082

# Banco de produção próprio (database-per-service) - configurável via variáveis de ambiente
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/historydb}
spring.datasource.username=${DB_USER:history}
spring.datasource.password=${DB_PASSWORD:history}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate NUNCA cria/altera schema em produção. Quem manda é o Flyway.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Registro no Eureka
eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true
