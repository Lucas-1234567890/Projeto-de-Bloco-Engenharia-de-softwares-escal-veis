version: "3.8"
services:
  db:
    image: postgres:16-alpine
    container_name: todo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tododb
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: todo
    ports:
      - "5432:5432"
    volumes:
      - todo_pg_data:/var/lib/postgresql/data

  # Banco próprio do history-service (database-per-service): cada microsserviço
  # tem seu schema isolado, sem acesso direto de um serviço ao banco do outro.
  history-db:
    image: postgres:16-alpine
    container_name: history-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: historydb
      POSTGRES_USER: history
      POSTGRES_PASSWORD: history
    ports:
      - "5433:5432"
    volumes:
      - history_pg_data:/var/lib/postgresql/data

  # TP4: message broker. AMQP na 5672; painel de gerenciamento em http://localhost:15672
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: todo-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: todo
      RABBITMQ_DEFAULT_PASS: todo
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  rabbitmq_data:
  todo_pg_data:
  history_pg_data:
