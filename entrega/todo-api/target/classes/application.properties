spring.application.name=todo-api
server.port=8080

# Banco de produção (Postgres) - configurável via variáveis de ambiente
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tododb}
spring.datasource.username=${DB_USER:todo}
spring.datasource.password=${DB_PASSWORD:todo}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate NUNCA cria/altera schema em produção. Quem manda é o Flyway.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Paginação default
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# Registro no Eureka, para localizar o history-service sem URL fixa
eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

# --- TP4: RabbitMQ (arquitetura orientada a eventos) ---
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:todo}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:todo}
# Se o broker estiver fora, falha rápido em vez de travar a requisição do usuário
spring.rabbitmq.connection-timeout=2s
