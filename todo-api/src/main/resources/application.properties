spring.application.name=todo-api
server.port=8080

# Banco de produção (Postgres) - configurável via variáveis de ambiente
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tododb}
spring.datasource.username=${DB_USER:todo}
spring.datasource.password=${DB_PASSWORD:todo}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate NUNCA cria/altera schema em produção. Quem manda é o Flyway.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Paginação default
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
